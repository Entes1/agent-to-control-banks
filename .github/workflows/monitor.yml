name: Hlidac urokovych sazeb

on:
  schedule:
    - cron: "0 5 * * *"   # 5:00 UTC = 6:00/7:00 v Brně
  workflow_dispatch:       # ruční spuštění tlačítkem

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Spustit hlídač
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py
      - name: Uložit nový stav
        run: |
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || git commit -m "Aktualizace sazeb $(date -u +%F)" && git push
          
